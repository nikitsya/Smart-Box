<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180">
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
            <path d="M0 0 L10 5 L0 10" fill="#53657a"/>
        </marker>
    </defs>
    <rect width="1600" height="1180" fill="#f5f7fb"/>
    <text x="65" y="68" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#1b3047">TempSafe ·
        prototype wiring
    </text>
    <text x="65" y="106" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#1b3047">Proposed
        circuit for Raspberry Pi 400 + Adafruit SCD-41 breakout
    </text>
    <text x="65" y="144" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#53657a">Exact
        electrical connections below · not a physical breadboard-hole layout
    </text>
    <rect x="65" y="195" width="390" height="420" rx="16" fill="#fff" stroke="#cfdae5" stroke-width="2"/>
    <text x="90" y="235" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#1b3047">Raspberry Pi
        400
    </text>
    <text x="90" y="269" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#1b3047">Rear 40-pin
        GPIO header
    </text>
    <rect x="555" y="195" width="370" height="420" rx="16" fill="#eef3f8" stroke="#cfdae5" stroke-width="2"/>
    <text x="580" y="235" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#1b3047">Solderless
        breadboard
    </text>
    <text x="580" y="269" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#1b3047">Jumper-wire
        connection points
    </text>
    <rect x="1045" y="195" width="490" height="420" rx="16" fill="#eaf7f4" stroke="#80bbae" stroke-width="2"/>
    <text x="1070" y="235" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#1b3047">Inside the
        plastic box
    </text>
    <text x="1070" y="273" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1b3047">Adafruit
        SCD-41 breakout
    </text>
    <text x="90" y="343" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#1b3047">Pin 1 · 3.3 V
    </text>
    <text x="1070" y="343" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#1b3047">VIN · sensor
        power
    </text>
    <line x1="455" y1="335" x2="555" y2="335" stroke="#c94252" stroke-width="4" stroke-dasharray=""/>
    <line x1="555" y1="335" x2="925" y2="335" stroke="#c94252" stroke-width="4" stroke-dasharray=""/>
    <line x1="925" y1="335" x2="1045" y2="335" stroke="#c94252" stroke-width="4" stroke-dasharray=""/>
    <circle cx="455" cy="335" r="7" fill="#c94252"/>
    <circle cx="555" cy="335" r="7" fill="#c94252"/>
    <circle cx="925" cy="335" r="7" fill="#c94252"/>
    <circle cx="1045" cy="335" r="7" fill="#c94252"/>
    <rect x="655" y="312" width="170" height="44" rx="7" fill="#eef3f8" stroke="#eef3f8" stroke-width="2"/>
    <text x="675" y="342" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#c94252">Power</text>
    <text x="90" y="413" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#1b3047">Pin 6 · GND
    </text>
    <text x="1070" y="413" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#1b3047">GND · common
        ground
    </text>
    <line x1="455" y1="405" x2="555" y2="405" stroke="#334155" stroke-width="4" stroke-dasharray=""/>
    <line x1="555" y1="405" x2="925" y2="405" stroke="#334155" stroke-width="4" stroke-dasharray=""/>
    <line x1="925" y1="405" x2="1045" y2="405" stroke="#334155" stroke-width="4" stroke-dasharray=""/>
    <circle cx="455" cy="405" r="7" fill="#334155"/>
    <circle cx="555" cy="405" r="7" fill="#334155"/>
    <circle cx="925" cy="405" r="7" fill="#334155"/>
    <circle cx="1045" cy="405" r="7" fill="#334155"/>
    <rect x="655" y="382" width="170" height="44" rx="7" fill="#eef3f8" stroke="#eef3f8" stroke-width="2"/>
    <text x="675" y="412" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#334155">Ground</text>
    <text x="90" y="483" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#1b3047">Pin 3 · GPIO2 /
        SDA
    </text>
    <text x="1070" y="483" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#1b3047">SDA · I²C
        data
    </text>
    <line x1="455" y1="475" x2="555" y2="475" stroke="#137db0" stroke-width="4" stroke-dasharray=""/>
    <line x1="555" y1="475" x2="925" y2="475" stroke="#137db0" stroke-width="4" stroke-dasharray=""/>
    <line x1="925" y1="475" x2="1045" y2="475" stroke="#137db0" stroke-width="4" stroke-dasharray=""/>
    <circle cx="455" cy="475" r="7" fill="#137db0"/>
    <circle cx="555" cy="475" r="7" fill="#137db0"/>
    <circle cx="925" cy="475" r="7" fill="#137db0"/>
    <circle cx="1045" cy="475" r="7" fill="#137db0"/>
    <rect x="655" y="452" width="170" height="44" rx="7" fill="#eef3f8" stroke="#eef3f8" stroke-width="2"/>
    <text x="675" y="482" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#137db0">Data</text>
    <text x="90" y="553" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#1b3047">Pin 5 · GPIO3 /
        SCL
    </text>
    <text x="1070" y="553" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#1b3047">SCL · I²C
        clock
    </text>
    <line x1="455" y1="545" x2="555" y2="545" stroke="#b67d08" stroke-width="4" stroke-dasharray=""/>
    <line x1="555" y1="545" x2="925" y2="545" stroke="#b67d08" stroke-width="4" stroke-dasharray=""/>
    <line x1="925" y1="545" x2="1045" y2="545" stroke="#b67d08" stroke-width="4" stroke-dasharray=""/>
    <circle cx="455" cy="545" r="7" fill="#b67d08"/>
    <circle cx="555" cy="545" r="7" fill="#b67d08"/>
    <circle cx="925" cy="545" r="7" fill="#b67d08"/>
    <circle cx="1045" cy="545" r="7" fill="#b67d08"/>
    <rect x="655" y="522" width="170" height="44" rx="7" fill="#eef3f8" stroke="#eef3f8" stroke-width="2"/>
    <text x="675" y="552" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#b67d08">Clock</text>
    <text x="580" y="593" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#53657a">Separate
        electrical nets; do not join them.
    </text>
    <text x="65" y="655" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1b3047">Local warning
        LED · proposed GPIO17 output
    </text>
    <rect x="65" y="680" width="1470" height="160" rx="16" fill="#fff" stroke="#cfdae5" stroke-width="2"/>
    <text x="90" y="728" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1b3047">Pi pin 11
    </text>
    <text x="90" y="762" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#1b3047">GPIO17 /
        BCM17
    </text>
    <line x1="275" y1="745" x2="430" y2="745" stroke="#7c55a5" stroke-width="4" stroke-dasharray=""/>
    <rect x="430" y="716" width="175" height="58" rx="5" fill="#f4ecfa" stroke="#7c55a5" stroke-width="2"/>
    <text x="455" y="752" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#1b3047">1 kΩ
        resistor
    </text>
    <line x1="605" y1="745" x2="790" y2="745" stroke="#7c55a5" stroke-width="4" stroke-dasharray=""/>
    <rect x="790" y="705" width="335" height="80" rx="8" fill="#fff8e7" stroke="#d6b75d" stroke-width="2"/>
    <text x="812" y="738" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1b3047">Single-colour
        warning LED
    </text>
    <text x="812" y="768" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#1b3047">Anode (+) →
        cathode (−)
    </text>
    <line x1="1125" y1="745" x2="1270" y2="745" stroke="#334155" stroke-width="4" stroke-dasharray=""/>
    <text x="1290" y="738" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1b3047">Pi pin 9 ·
        GND
    </text>
    <text x="90" y="815" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#53657a">Route on the
        breadboard. 1 kΩ is a conservative starting value; confirm brightness and LED specifications.
    </text>
    <rect x="65" y="875" width="440" height="110" rx="16" fill="#fff" stroke="#cfdae5" stroke-width="2"/>
    <text x="88" y="914" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1b3047">USB-C mains
        power supply
    </text>
    <text x="88" y="950" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#1b3047">5 V / 3 A → Pi
        400 power port
    </text>
    <rect x="620" y="875" width="330" height="110" rx="16" fill="#fff" stroke="#cfdae5" stroke-width="2"/>
    <text x="650" y="914" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1b3047">Raspberry Pi
        400
    </text>
    <text x="650" y="950" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#1b3047">Runs the
        sensor software
    </text>
    <line x1="505" y1="930" x2="615" y2="930" stroke="#53657a" stroke-width="4" stroke-dasharray=""
          marker-end="url(#arrow)"/>
    <rect x="1115" y="875" width="420" height="110" rx="16" fill="#fff" stroke="#cfdae5" stroke-width="2"/>
    <text x="1138" y="914" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1b3047">Laptop ·
        remote access
    </text>
    <text x="1138" y="950" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#1b3047">Raspberry Pi
        Connect
    </text>
    <line x1="955" y1="930" x2="1105" y2="930" stroke="#53657a" stroke-width="4" stroke-dasharray="10 7"
          marker-end="url(#arrow)"/>
    <text x="970" y="905" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1b3047">Wi-Fi /
        Internet
    </text>
    <text x="65" y="1033" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1b3047">READ THE
        CONNECTIONS BY NAME, NOT BY WIRE COLOUR
    </text>
    <text x="65" y="1068" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#1b3047">Physical pin
        numbers ≠ GPIO numbers. Locate pin 1 on your Pi 400 before wiring; disconnect power first.
    </text>
    <text x="65" y="1103" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#1b3047">VIN is the
        sensor power input. Leave 3Vo unconnected. Enable I²C. The plastic box has no electrical connection.
    </text>
    <text x="65" y="1138" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#53657a">Buzzer is
        optional and omitted. Verify the actual breakout, LED polarity and circuit before powering the prototype.
    </text>
</svg>