<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in – TEMSAFE</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
<main>
  <div class="top">
    <h1 class="brand">TEMSAFE</h1>
    <span class="muted">Secure sign-in</span>
  </div>
  <p class="muted">Sign in to view the temperature of the box assigned to you.</p>

  <form id="signin" class="card" novalidate>
    <label for="username">Email or username</label>
    <input id="username" name="username" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit">Sign in</button>
  </form>

  <p><span id="api-status" class="api-status down" role="status">Checking API…</span></p>
  <p class="muted">Sign-in is not connected yet. Pages:
    <a href="pages/dashboard.html">dashboard</a> ·
    <a href="pages/history.html">history</a></p>
</main>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
</body>
</html>
